openapi: 3.1.0
info:
  title: Fake API
  description: "Sample API"
  version: "1.0.0"
paths:
  /api/v1/greet:
    get:
      summary: "Hello World"
      description: "Sample endpoint that return greetings"
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello, World!"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerErrorDTO'
security:
  - BearerAuth: []
components:
  schemas:
    WorkerErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - WORKER_NOT_FOUND
            - WORKER_BAD_REQUEST
            - WORKER_GENERIC_ERROR
            - WORKER_TOO_MANY_REQUESTS
            - WORKER_UNAUTHORIZED
            - WORKER_FORBIDDEN
            - WORKER_CONFLICT
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDTO"
        traceId:
          type: string
    ErrorFieldDTO:
      type: object
      required:
        - field
        - error
        - message
      properties:
        field:
          type: string
        error:
          type: string
        message:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
