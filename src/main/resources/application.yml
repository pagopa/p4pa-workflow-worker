server:
  http: "\${SERVER_PORT:8080}"

spring:
  application:
    name: ${artifactId}
    version: ${version}
  jmx.enabled: true
  threads:
    virtual:
      enabled: "\${VIRTUAL_THREADS_ENABLED:true}"
  temporal:
    namespace: "\${TEMPORAL_SERVER_NAMESPACE:default}"
    connection:
      enable-https: "\${TEMPORAL_SERVER_ENABLE_HTTPS:false}"
      target: "\${TEMPORAL_SERVER_HOST:localhost}:\${TEMPORAL_SERVER_PORT:7233}"

    # Listing workers and registered activities
    workers:
      # debt position
      - task-queue: CheckDebtPositionExpirationWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_CHECK_DEBT_POSITION_EXPIRATION_POLLER_SIZE:2}"
        activity-beans:
          - debtPositionExpirationActivityImpl
      # debt position sync
      - task-queue: DebtPositionSynchronize_NoPagoPA_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_MODE_NOPAGOPA_SIZE:1}"
        activity-beans:
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      - task-queue: DebtPositionSynchronize_SYNC_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_MODE_SYNC_POLLER_SIZE:5}"
        activity-beans:
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      - task-queue: DebtPositionSynchronize_SYNC+ACA_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_MODE_ACA_POLLER_SIZE:5}"
        activity-beans:
          - synchronizeInstallmentAcaActivityImpl
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      - task-queue: DebtPositionSynchronize_SYNC+GPDPRELOAD_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_MODE_GPDPRELOAD_POLLER_SIZE:3}"
        activity-beans:
          - synchronizeInstallmentGpdPreLoadActivityImpl
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      - task-queue: DebtPositionSynchronize_SYNC+ACA+GPDPRELOAD_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_MODE_ACAGPDPRELOAD_POLLER_SIZE:3}"
        activity-beans:
          - synchronizeInstallmentGpdPreLoadActivityImpl
          - synchronizeInstallmentAcaActivityImpl
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      - task-queue: DebtPositionSynchronize_ASYNC_GPD_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_MODE_GPD_POLLER_SIZE:5}"
        activity-beans:
          - synchronizeInstallmentGpdActivityImpl
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      - task-queue: DebtPositionSynchronize_finalizeMassive_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_MASSIVE_SYNC_FINALIZE_POLLER_SIZE:3}"
        activity-beans:
          - finalizeDebtPositionSyncStatusActivityImpl
          - IONotificationDebtPositionActivityImpl
      # debt position custom WF sync
      - task-queue: DebtPositionSynchronize_fine_WF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_DP_SYNC_CUSTOM_FINE_POLLER_SIZE:5}"
        activity-beans:
          - debtPositionSynchronizeFineActivityImpl
      - task-queue: FineReductionOptionExpirationWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_FINE_REDUCTION_EXPIRATION_POLLER_SIZE:3}"
        activity-beans:
          - debtPositionFineReductionOptionExpirationActivityImpl
      # ingestion flow
      - task-queue: PaymentsReportingIngestionWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_PAYMENTS_REPORTING_POLLER_SIZE:2}"
        activity-beans:
          - paymentsReportingIngestionFlowFileActivityImpl
          - sendEmailIngestionFlowActivityImpl
          - updateIngestionFlowStatusActivityImpl
      - task-queue: TreasuryOpiIngestionWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_TREASURY_OPI_POLLER_SIZE:2}"
        activity-beans:
          - treasuryOpiIngestionActivityImpl
          - sendEmailIngestionFlowActivityImpl
          - updateIngestionFlowStatusActivityImpl
      - task-queue: ReceiptIngestionWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_RT_POLLER_SIZE:2}"
        activity-beans:
          - receiptIngestionActivityImpl
          - updateIngestionFlowStatusActivityImpl
          - sendEmailIngestionFlowActivityImpl
      - task-queue: ReceiptPagopaIngestionWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_RT_POLLER_SIZE:2}"
        activity-beans:
          - receiptPagopaIngestionActivityImpl
          - updateIngestionFlowStatusActivityImpl
          - receiptPagopaNotifySilActivityImpl
          - receiptPagopaSendEmailActivityImpl
      - task-queue: DebtPositionIngestionFlowWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_DP_POLLER_SIZE:2}"
        activity-beans:
          - ingestionFlowFileProcessingLockerActivityImpl
          - updateIngestionFlowStatusActivityImpl
          - sendEmailIngestionFlowActivityImpl
          - installmentIngestionFlowFileActivityImpl
          - synchronizeIngestedDebtPositionActivityImpl
          - massiveNoticeGenerationStatusRetrieverActivityImpl
      - task-queue: PaymentNotificationIngestionWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_PAYMENT_NOTIFICATION_POLLER_SIZE:2}"
        activity-beans:
          - paymentNotificationIngestionActivityImpl
          - sendEmailIngestionFlowActivityImpl
          - updateIngestionFlowStatusActivityImpl
      # classification
      - task-queue: IudClassificationWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_CLASSIFICATION_IUD_POLLER_SIZE:5}"
        activity-beans:
          - clearClassifyIudActivityImpl
          - iudClassificationActivityImpl
      - task-queue: IufClassificationWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_CASSIFICATION_IUF_POLLER_SIZE:5}"
        activity-beans:
          - clearClassifyIufActivityImpl
          - iufClassificationActivityImpl
          - paymentsReportingImplicitReceiptHandlerActivityImpl
      - task-queue: TransferClassificationWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_CLASSIFICATION_TRANSFER_POLLER_SIZE:5}"
        activity-beans:
          - transferClassificationActivityImpl
      # pagopa payments reporting
      - task-queue: PaymentsReportingPagoPaBrokersFetchWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_PAYMENTS_REPORTING_BROKERS_FETCH_POLLER_SIZE:1}"
        activity-beans:
          - brokersRetrieverActivityImpl
          - organizationBrokeredActiveRetrieverActivityImpl
      - task-queue: PaymentsReportingPagoPaOrganizationFetchWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_PAYMENTS_REPORTING_PAGOPA_FETCH_POLLER_SIZE:3}"
        activity-beans:
          - organizationPaymentsReportingPagoPaListRetrieverActivityImpl
          - organizationPaymentsReportingPagoPaRetrieverActivityImpl
      # pagopa taxonomy sync
      - task-queue: SynchronizeTaxonomyPagoPaFetchWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_SYNC_TAXONOMY_POLLER_SIZE:1}"
        activity-beans:
          - synchronizeTaxonomyActivityImpl
      # pagopa send
      - task-queue: SendNotificationProcessWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_SEND_NOTIFICATION_POLLER_SIZE:3}"
        activity-beans:
          - preloadSendFileActivityImpl
          - uploadSendFileActivityImpl
          - deliveryNotificationActivityImpl
          - notificationStatusActivityImpl
          - getSendNotificationActivityImpl
      - task-queue: SendNotificationDateRetrieveWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_SEND_NOTIFICATION_DT_RETRIEVE_POLLER_SIZE:3}"
        activity-beans:
          - sendNotificationDateRetrieveActivityImpl
      # assessments
      - task-queue: CreateAssessmentsWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_CREATE_ASSESSMENT_POLLER_SIZE:3}"
        activity-beans:
          - assessmentsCreationActivityImpl
      # export file
      - task-queue: ExportFileWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_EXPORT_FILE_POLLER_SIZE:5}"
        activity-beans:
          - updateExportFileStatusActivityImpl
          - exportFileActivityImpl
      - task-queue: ExportFileExpirationHandlerWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_EXPORT_FILE_EXPIRATION_POLLER_SIZE:2}"
        activity-beans:
          - exportFileExpirationHandlerActivityImpl
      # organization
      - task-queue: OrganizationIngestionWF
        capacity:
          max-concurrent-activity-task-pollers: "\${WF_INGESTION_ORGANIZATION_POLLER_SIZE:3}"
        activity-beans:
          - organizationIngestionActivityImpl
          - sendEmailIngestionFlowActivityImpl
          - updateIngestionFlowStatusActivityImpl
management:
  info:
    build.enabled: true
    java.enabled: true
    git.enabled: true
  tracing:
    baggage.remote-fields:
      - X-user-id
  observations:
    http.server:
        filter.order: -100
  endpoints:
    jmx:
      exposure.include: "*"
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  health:
    mail.enabled: false
  endpoint:
    health:
      probes.enabled: true
      logging.slow-indicator-threshold: "\${HEALTH_ACTUATOR_LOGGER_TIMEOUT_DURATION:PT1S}"
      group:
        readiness.include: "*"
        liveness.include: livenessState,diskSpace,ping
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${artifactId}
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true
    enable:
      jvm: true
      process: true
      system: true
      http: true
      logback: true

springdoc:
  writer-with-default-pretty-printer: true

logging:
  level:
    root: "\${LOG_LEVEL_ROOT:INFO}"
    it.gov.pagopa: "\${LOG_LEVEL_PAGOPA:INFO}"
    org.springframework: "\${LOG_LEVEL_SPRING:INFO}"
    org.springframework.boot.availability: "\${LOG_LEVEL_SPRING_BOOT_AVAILABILITY:DEBUG}"
    it.gov.pagopa.pu.worker.exception.WorkerExceptionHandler: "\${LOGGING_LEVEL_API_REQUEST_EXCEPTION:INFO}"
    org.springdoc.core.utils.SpringDocAnnotationsUtils: "\${LOG_LEVEL_SPRING_DOC:ERROR}"
    PERFORMANCE_LOG: "\${LOG_LEVEL_PERFORMANCE_LOG:INFO}"
    PERFORMANCE_LOG.API_REQUEST: "\${LOG_LEVEL_PERFORMANCE_LOG_API_REQUEST:\${logging.level.PERFORMANCE_LOG}}"
    PERFORMANCE_LOG.REST_INVOKE: "\${LOG_LEVEL_PERFORMANCE_LOG_REST_INVOKE:\${logging.level.PERFORMANCE_LOG}}"

